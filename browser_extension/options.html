<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>duAI - Opciones</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000000;
      color: #FFFFFF;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.6;
    }
    h1 { font-size: 24px; margin-bottom: 24px; letter-spacing: 1px; }
    h2 { font-size: 18px; margin: 24px 0 12px; color: #FFD700; text-transform: uppercase; letter-spacing: 1px; }
    .card {
      background: #1A1A1A;
      border: 1px solid #333333;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: #CCCCCC; }
    input[type="text"], select {
      width: 100%;
      padding: 10px;
      background: #000000;
      border: 1px solid #444444;
      border-radius: 6px;
      color: #FFFFFF;
      font-size: 13px;
      margin-bottom: 12px;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #FFD700;
    }
    button {
      background: #FFD700;
      color: #000000;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 8px;
      margin-bottom: 8px;
    }
    button:hover { background: #FFED4A; }
    button.secondary { background: #333333; color: #FFFFFF; }
    button.secondary:hover { background: #444444; }
    button.danger { background: #EF4444; color: #FFFFFF; }
    button.danger:hover { background: #F87171; }
    .domain-list { max-height: 300px; overflow-y: auto; border: 1px solid #333333; border-radius: 8px; padding: 12px; background: #000000; }
    .domain-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333333; font-size: 13px; }
    .domain-row:last-child { border-bottom: none; }
    .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    input[type="checkbox"] { width: auto; }
    .footer { margin-top: 32px; font-size: 11px; color: #666666; border-top: 1px solid #333333; padding-top: 16px; }
    .ai-domains { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .ai-domain-tag {
      background: #333333;
      color: #CCCCCC;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      border: 1px solid #444444;
    }
    .ai-domain-tag.ai { color: #EF4444; border-color: #EF4444; }
  </style>
</head>
<body>
  <h1>duAI — Opciones</h1>

  <div class="card">
    <h2>Dominios de IA monitorizados</h2>
    <p style="color: #AAAAAA; font-size: 13px; margin-bottom: 12px;">
      La extensión detecta y rastrea visitas a estos dominios de IA:
    </p>
    <div class="ai-domains" id="aiDomains"></div>
  </div>

  <div class="card">
    <h2>Configuración</h2>
    <div class="checkbox-row">
      <input type="checkbox" id="cbStats" checked>
      <label for="cbStats">Habilitar estadísticas de rastreo</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cbBadge">
      <label for="cbBadge">Mostrar contador en el icono</label>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="cbNotifications">
      <label for="cbNotifications">Notificar al visitar sitios de IA</label>
    </div>
    <label>Retener datos (días)</label>
    <input type="text" id="retentionDays" value="30">
  </div>

  <div class="card">
    <h2>Acciones</h2>
    <button class="btn-secondary" id="btnExport">Exportar estadísticas</button>
    <button class="btn-danger" id="btnClearAll">Borrar todo</button>
    <button class="btn-secondary" id="btnOpenApp">Abrir duAI Desktop</button>
  </div>

  <div class="footer">
    duAI Browser Extension v2.0.0<br>
    Compañero de duAI Desktop — 100% local, sin telemetría
  </div>

  <script>
    const AI_DOMAINS = [
      "chatgpt.com", "openai.com", "claude.ai", "anthropic.com",
      "gemini.google.com", "perplexity.ai", "copilot.microsoft.com",
      "poe.com", "character.ai", "deepseek.com", "mistral.ai",
      "grok.com", "bard.google.com", "aistudio.google.com"
    ];

    function renderDomains() {
      const container = document.getElementById("aiDomains");
      container.innerHTML = AI_DOMAINS.map(d => 
        `<span class="ai-domain-tag">${d}</span>`
      ).join("");
    }

    document.getElementById("btnClearAll").addEventListener("click", () => {
      if (confirm("¿Borrar todas las estadísticas de rastreo?")) {
        chrome.runtime.sendMessage({ action: "clearStats" }, () => {
          alert("Estadísticas borradas");
        });
      }
    });

    document.getElementById("btnOpenApp").addEventListener("click", () => {
      // Try to open desktop app via custom protocol
      chrome.tabs.create({ url: "duai://open" }).catch(() => {
        alert("No se pudo abrir duAI Desktop. Asegúrate de que esté instalado.");
      });
    });

    document.getElementById("btnExport").addEventListener("click", () => {
      chrome.runtime.sendMessage({ action: "getStats" }, (response) => {
        const blob = new Blob([JSON.stringify(response?.stats || {}, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "duai_stats.json";
        a.click();
      });
    });

    renderDomains();
  </script>
</body>
</html>
