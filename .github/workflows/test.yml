name: Tests

on:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11+
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar suites de prueba (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python smoke_test.py
          python e2e_test.py
          python modules_test.py
          python ui_test.py
          python i18n_check.py
          python test_e2e_extended.py

      - name: Subir artefactos si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: duai-test-artifacts
          path: |
            out.txt
            duai.log
            privacy_report.png
          retention-days: 7
